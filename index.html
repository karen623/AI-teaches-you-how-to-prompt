<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt 教學遊戲 — 原型（學生端＋教師端）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C2033;--ink-soft:#5B6080;--paper:#F6F5F1;--line:#E4E2D8;--d1:#C1495B;--d2:#C98A2E;--d4:#3B6EA5;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;}
#picker{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
.wrap{max-width:640px;width:100%;text-align:center;}
h1{font-family:'Noto Serif TC',serif;font-size:28px;margin:0 0 8px;}
.sub{color:var(--ink-soft);margin:0 0 28px;}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.role{border:2px solid var(--line);background:#fff;border-radius:16px;padding:28px 20px;cursor:pointer;font:inherit;color:inherit;text-align:center;transition:border-color .15s,transform .12s;}
.role:hover{border-color:var(--d4);transform:translateY(-2px);}
.role .av{width:52px;height:52px;border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;}
.role .t{font-size:18px;font-weight:700;}
.role .d{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
#frame{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;}
#switch{display:none;position:fixed;right:16px;bottom:16px;z-index:9999;border:0;border-radius:99px;background:var(--ink);color:#fff;padding:9px 16px;font:inherit;font-size:13px;cursor:pointer;box-shadow:0 6px 16px rgba(28,32,51,.25);opacity:.85;}
#switch:hover{opacity:1;}
body.viewing #picker{display:none;}
body.viewing #frame,body.viewing #switch{display:block;}
</style>
</head>
<body>
<div id="picker"><div class="wrap">
  <h1>Prompt 教學遊戲</h1>
  <p class="sub">原型展示 · 請選擇要進入的身分</p>
  <div class="roles">
    <button class="role" data-role="student"><div class="av" style="background:linear-gradient(135deg,var(--d2),var(--d1))">學</div><div class="t">學生端</div><div class="d">課程、練習、競賽</div></button>
    <button class="role" data-role="teacher"><div class="av" style="background:linear-gradient(135deg,var(--d4),#2E3552)">師</div><div class="t">教師端</div><div class="d">課程管理、評分、監控台</div></button>
  </div>
</div></div>
<iframe id="frame" title="原型畫面"></iframe>
<button id="switch">⇄ 切換身分</button>

<!-- 兩端各自是一份完整的 HTML，放在 iframe 裡執行，彼此的 CSS／JS 不會互相干擾。
     內容中的 script 結束標籤與 HTML 註解開頭已轉義（前面加反斜線），載入時會還原。 -->
<script type="text/plain" id="src-student"><!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt 教學遊戲 — 學生端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2033; --ink-soft:#5B6080; --ink-faint:#9498B3;
  --paper:#F6F5F1; --card:#FFFFFF; --line:#E4E2D8;
  --d1:#C1495B; --d1-bg:#FBEAEC;
  --d2:#C98A2E; --d2-bg:#FBF1E1;
  --d3:#2F8F6C; --d3-bg:#E7F4EE;
  --d4:#3B6EA5; --d4-bg:#E9F1FA;
  --team-e:#8B5FBF;
  --gold:#C99A2E; --silver:#9AA0B3; --bronze:#B5652E;
  --sidebar-w:236px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Noto Serif TC','Noto Serif',serif;margin:0;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D8D6C9;border-radius:99px;}

.app{min-height:100vh;}

/* hamburger: fixed top-left, only shown while sidebar is collapsed */
.hamburger-btn{position:fixed;top:14px;left:14px;width:40px;height:40px;border-radius:10px;background:var(--ink);color:#fff;border:none;display:none;align-items:center;justify-content:center;font-size:19px;cursor:pointer;z-index:90;box-shadow:0 6px 16px rgba(28,32,51,.25);}
body.sidebar-collapsed .hamburger-btn{display:flex;}

/* sidebar: fixed full-height column that can fully disappear */
.sidebar{position:fixed;top:0;left:0;height:100vh;width:var(--sidebar-w);overflow-y:auto;background:var(--ink);color:#EDEDF3;padding:18px 14px;display:flex;flex-direction:column;gap:4px;transition:transform .25s ease;z-index:50;transform:translateX(0);}
body.sidebar-collapsed .sidebar{transform:translateX(-100%);}
body.in-arena .sidebar{display:none;}
.sb-top{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:0 4px;}
.sb-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--d2),var(--d1));flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15.5px;}
.sb-who{overflow:hidden;white-space:nowrap;}
.sb-who .name{font-size:15.5px;font-weight:700;}
.sb-who .role{font-size:13px;color:#A9ADCB;}
.sb-toggle{flex:none;width:28px;height:28px;border-radius:8px;background:#2A2F49;border:1px solid #3A3F5C;color:#EDEDF3;cursor:pointer;font-size:15.5px;display:flex;align-items:center;justify-content:center;}
.sb-toggle:hover{background:#343B5C;}
.sb-nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.sb-link{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;color:#C6C9E2;font-size:15px;cursor:pointer;white-space:nowrap;overflow:hidden;}
.sb-link .ic{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;}
.sb-link .ic svg{width:100%;height:100%;}
.sb-link:hover{background:#2A2F49;color:#fff;}
.sb-link.active{background:#2E3552;color:#fff;font-weight:700;}

/* main column: shifts to make room for the fixed sidebar */
.main-col{margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column;transition:margin-left .25s ease;}
body.sidebar-collapsed .main-col{margin-left:0;}
body.in-arena .main-col{margin-left:0;}

.topbar-app{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20;flex-wrap:wrap;transition:padding-left .25s ease;}
body.sidebar-collapsed .topbar-app{padding-left:70px;}
body.in-arena .topbar-app{display:none;}
.crumb{font-size:20px;font-weight:700;font-family:'Noto Serif TC',serif;}
.crumb .sub{display:block;font-family:'Noto Sans TC',sans-serif;font-size:13.5px;font-weight:400;color:var(--ink-soft);margin-top:2px;}

main{padding:28px;flex:1;}
.screen{display:none;}
.screen.active{display:block;animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;}
.hint-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:15.5px;font-weight:500;cursor:pointer;transition:opacity .15s ease;}
.hint-btn:hover{opacity:.85;}
.hint-btn.ghost{background:transparent;color:var(--ink);}
.hint-btn.sm{padding:7px 12px;font-size:14px;border-radius:7px;}
.hint-btn.demo{background:#fff;color:var(--ink-soft);border:1.5px dashed var(--ink-faint);}
.eyebrow{font-size:14px;color:var(--ink-soft);margin-bottom:4px;}
.preview-banner{background:#F1F0EA;border:1px dashed #C7C4B4;border-radius:10px;padding:10px 14px;font-size:14px;color:var(--ink-soft);margin-bottom:16px;}

/* mascot + modal */
.mascot-wrap{position:fixed;right:26px;bottom:26px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;}
.mascot{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--d1) 0 90deg,var(--d2) 90deg 180deg,var(--d3) 180deg 270deg,var(--d4) 270deg 360deg);cursor:pointer;position:relative;box-shadow:0 10px 24px rgba(28,32,51,.25);animation:bob 2.6s ease-in-out infinite;border:3px solid #fff;}
.mascot::before,.mascot::after{content:'';position:absolute;width:7px;height:9px;background:#1C2033;border-radius:50%;top:24px;}
.mascot::before{left:19px;} .mascot::after{left:38px;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
.mascot-label{font-size:13px;background:var(--ink);color:#fff;padding:4px 10px;border-radius:99px;font-weight:700;}
.modal-veil{position:fixed;inset:0;background:rgba(20,20,30,.42);display:none;align-items:center;justify-content:center;z-index:80;}
.modal-veil.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:26px 26px 22px;width:340px;box-shadow:0 24px 60px rgba(0,0,0,.25);}
.modal-box h3{font-size:19px;margin-bottom:6px;}
.modal-box p{font-size:14.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 16px;}
.code-input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:20px;letter-spacing:.2em;text-align:center;font-family:'JetBrains Mono',monospace;margin-bottom:14px;}
.code-input:focus{outline:none;border-color:var(--ink);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}

/* HOME: level map */
.home-grid{display:grid;grid-template-columns:2.2fr 1fr;gap:20px;align-items:start;}
@media (max-width:980px){.home-grid{grid-template-columns:1fr;}}
.map-title{font-size:21.5px;font-weight:700;margin-bottom:4px;}
.map-sub{font-size:14.5px;color:var(--ink-soft);margin-bottom:18px;}

/* HOME: LeetCode-style problem list */
.problem-list{display:flex;flex-direction:column;}
.problem-row{display:flex;align-items:center;gap:14px;padding:15px 8px;border-bottom:1px solid var(--line);}
.problem-row:last-child{border-bottom:none;}
.problem-row[data-goto]{cursor:pointer;transition:background .15s ease;}
.problem-row[data-goto]:hover{background:var(--paper);}
.prow-status{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;}
.prow-status svg{width:100%;height:100%;}
.prow-title{flex:1;font-size:14.5px;font-weight:600;color:var(--ink);}
.problem-row.locked .prow-title{color:var(--ink-faint);}
.prow-note{display:block;font-size:11px;font-weight:400;color:var(--ink-faint);margin-top:2px;}
.prow-diff{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;flex:none;}
.prow-diff.bronze{background:#F1EADD;color:#8A6A2E;}
.prow-diff.silver{background:#EAEAF0;color:#5B6080;}
.prow-diff.gold{background:#FBF1D8;color:#A67E12;}
.prow-diff.diamond{background:#EDE7FA;color:#5B3FA8;}

.side-stack{display:flex;flex-direction:column;gap:16px;}
.radar-mini{display:grid;gap:10px;}
.radar-mini .row{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:8px;}
.radar-mini .lbl{font-size:14px;font-weight:700;}
.radar-mini .track{height:7px;border-radius:99px;background:#EEEDE6;overflow:hidden;}
.radar-mini .fill{height:100%;border-radius:99px;}
.radar-mini .pct{font-size:13px;text-align:right;color:var(--ink-soft);}
.streak-card{display:flex;justify-content:space-between;align-items:center;}
.streak-card .num{font-size:29px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.streak-mascot{font-size:33.5px;animation:streakBounce 1.4s ease-in-out infinite;}
@keyframes streakBounce{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-5px) rotate(4deg);}}
.arena-cta{background:linear-gradient(135deg,#2E3552,#1C2033);color:#fff;border:none;cursor:pointer;text-align:left;width:100%;}
.arena-cta .t{font-weight:700;font-size:16px;margin-bottom:4px;}
.arena-cta .d{font-size:13.5px;color:#C6C9E2;line-height:1.6;}

/* TASK PLAYER (dojo) */
.dojo-grid{display:grid;grid-template-columns:1.05fr 1.5fr;gap:20px;align-items:start;}
@media (max-width:880px){.dojo-grid{grid-template-columns:1fr;}}
.brief-tag{display:inline-block;font-size:13.5px;padding:3px 10px;border-radius:999px;background:var(--d2-bg);color:var(--d2);font-weight:700;margin-bottom:10px;}
.brief-title{font-size:21.5px;font-weight:700;margin-bottom:10px;line-height:1.5;}
.brief-body{font-size:16px;line-height:1.85;color:var(--ink-soft);}
.trap-note{margin-top:16px;padding:12px 14px;border-radius:10px;background:#F1F0EA;font-size:14.5px;color:var(--ink-soft);border-left:3px solid var(--ink);}
textarea.pinput{width:100%;min-height:100px;margin-top:14px;padding:14px;border-radius:10px;border:1.5px solid var(--line);font-family:'Noto Sans TC',sans-serif;font-size:16px;line-height:1.7;resize:vertical;color:var(--ink);background:#fff;}
textarea.pinput:focus{outline:none;border-color:var(--ink);}
.submit-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.attempt-count{font-size:14px;color:var(--ink-soft);}
.score-empty{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:15.5px;}
.dbar-row{display:grid;grid-template-columns:88px 1fr 40px;align-items:center;gap:10px;margin-bottom:14px;}
.dbar-label{font-size:15px;font-weight:700;}
.dbar-track{height:9px;border-radius:99px;background:#EEEDE6;overflow:hidden;}
.dbar-fill{height:100%;width:0%;border-radius:99px;transition:width 1.1s cubic-bezier(.22,.9,.3,1);}
.dbar-score{font-size:14.5px;text-align:right;opacity:0;transition:opacity .4s ease .6s;font-variant-numeric:tabular-nums;}
.checklist{margin-top:6px;display:grid;gap:7px;}
.check-item{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;color:var(--ink-soft);opacity:0;transform:translateX(-6px);transition:all .35s ease;}
.check-item.show{opacity:1;transform:translateX(0);}
.check-item .mark{width:16px;flex:none;font-weight:700;}
.check-item.pass .mark{color:var(--d3);} .check-item.fail .mark{color:var(--d1);}
.rewrite-box{margin-top:16px;padding:16px 18px;border-radius:12px;background:var(--d3-bg);border:1px solid #CDE7DA;opacity:0;max-height:0;overflow:hidden;transition:opacity .5s ease,max-height .5s ease;}
.rewrite-box.show{opacity:1;max-height:400px;}
.rewrite-box .label{font-size:13.5px;font-weight:700;color:var(--d3);margin-bottom:8px;}
.rewrite-box .txt{font-size:15px;line-height:1.8;}
.rewrite-box mark{background:#CDEBDB;color:var(--ink);border-radius:3px;padding:0 2px;}

/* BANK (解方發想題庫) */
.bank-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media (max-width:780px){.bank-grid{grid-template-columns:1fr;}}
.bank-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 17px;cursor:pointer;transition:transform .15s ease,border-color .15s ease;}
.bank-card:hover{transform:translateY(-2px);border-color:var(--ink);}
.bank-card .diff{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;display:inline-block;margin-bottom:9px;}
.diff.bronze{background:#F1EADD;color:#8A6A2E;}
.diff.silver{background:#EAEAF0;color:#5B6080;}
.diff.gold{background:#FBF1D8;color:#A67E12;}
.diff.diamond{background:#EDE7FA;color:#5B3FA8;}
.bank-card .t{font-size:16px;font-weight:700;margin-bottom:6px;}
.bank-card .d{font-size:14.5px;color:var(--ink-soft);line-height:1.6;}
.bank-card .go{font-size:13.5px;color:var(--d3);font-weight:700;margin-top:10px;}

/* MY COURSES */
.course-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media (max-width:780px){.course-grid{grid-template-columns:1fr;}}
.course-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 17px;cursor:pointer;transition:transform .15s ease,border-color .15s ease;}
.course-card:hover{transform:translateY(-2px);border-color:var(--ink);}
.course-card .t{font-size:16px;font-weight:700;margin-bottom:6px;}
.course-card .d{font-size:14.5px;color:var(--ink-soft);margin-bottom:10px;}
.course-badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-block;}
.course-badge.live{background:var(--d1-bg);color:var(--d1);}
.course-badge.idle{background:#EEEDE6;color:var(--ink-soft);}
.course-arena-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px;}
@media (max-width:780px){.course-arena-list{grid-template-columns:1fr;}}
.course-arena-card{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;gap:12px;}
.course-arena-card .t{font-size:15.5px;font-weight:700;}
.course-arena-card .d{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
.course-arena-empty{font-size:14.5px;color:var(--ink-soft);margin-top:8px;}
.course-assignments-locked{opacity:.7;}
.course-assignments-empty{font-size:14.5px;color:var(--ink-soft);padding:10px 0;}

/* ROSTER (同學名單) */
.roster-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px;}
@media (max-width:980px){.roster-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:520px){.roster-grid{grid-template-columns:1fr;}}
.roster-card{display:flex;flex-direction:row;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:transform .15s ease,border-color .15s ease;text-align:left;}
.roster-card:hover{transform:translateY(-2px);border-color:var(--ink);}
.roster-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;flex:none;}
.roster-name{font-size:14.5px;font-weight:700;color:var(--ink);}

/* STUDENT DETAIL */
.sd-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
.sd-row:last-child{border-bottom:none;}
.sd-row .sd-label{color:var(--ink-soft);}
.sd-row .sd-value{font-weight:700;color:var(--ink);}
.sd-empty{font-size:14.5px;color:var(--ink-soft);padding:6px 0;}
.sd-record-line{font-size:14.5px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--line);}
.sd-record-line:last-child{border-bottom:none;}

/* content moderation */
.moderation-note{display:none;margin-top:10px;font-size:14px;color:var(--d1);background:var(--d1-bg);border-radius:9px;padding:9px 12px;}
.moderation-note.show{display:block;}

/* ARENA STUDENT */
.arena-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.round-pill{background:var(--d2-bg);color:var(--d2);font-weight:700;font-size:14px;padding:5px 12px;border-radius:99px;}
.timer{font-family:'JetBrains Mono',monospace;font-size:22.5px;font-weight:700;margin-top:6px;}
.timer-label{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.subq-heading{font-size:19px;font-weight:700;margin-top:6px;}
.subq-tabs{display:flex;gap:6px;margin-top:10px;}
.subq-tab{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:13.5px;font-weight:700;padding:5px 12px;border-radius:99px;cursor:pointer;}
.subq-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.pause-banner{display:none;background:var(--d1-bg);border:1px solid #F0C6CC;color:var(--d1);border-radius:10px;padding:10px 14px;font-size:14.5px;font-weight:700;margin-bottom:16px;}
.pause-banner.show{display:block;}
.arena-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
@media (max-width:980px){.arena-layout{grid-template-columns:1fr;}}
.after-draft{display:none;}
.after-draft.show{display:block;}
.diff-block{background:var(--d4-bg);border-radius:10px;padding:13px 15px;margin-top:8px;}
.diff-row{font-size:15px;line-height:1.8;color:var(--ink);}
.diff-row:not(:last-child){margin-bottom:6px;}
.chat-role-tag{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:8px;}
.shared-chat{margin-top:8px;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}
.chat-msg{font-size:15px;line-height:1.7;padding:10px 12px;border-radius:10px;background:var(--paper);}
.chat-msg.rep{background:var(--d3-bg);}
.chat-msg.ai{background:var(--d4-bg);}
.chat-msg b{color:var(--ink);}
.chat-input-row{display:flex;gap:8px;margin-top:10px;}
.chat-input-row textarea{flex:1;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-family:'Noto Sans TC',sans-serif;font-size:15px;resize:vertical;}
.chat-readonly-note{display:none;margin-top:10px;font-size:14px;color:var(--ink-soft);background:var(--paper);border-radius:9px;padding:10px 12px;}
.cov-mini{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.cov-mini .row{display:flex;align-items:center;gap:8px;font-size:14px;}
.cov-mini .dot{width:9px;height:9px;border-radius:2px;flex:none;}
.cov-mini .dot.on{background:var(--d3);}
.other-teams{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.pillmini{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);}
.toast-hint{position:fixed;right:26px;bottom:26px;width:290px;z-index:70;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,20,30,.18);padding:14px 15px;transform:translateY(20px) scale(.96);opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.2,.8,.3,1);}
.toast-hint.show{transform:translateY(0) scale(1);opacity:1;}
.toast-hint .who{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.toast-hint .who .badge{background:var(--d4);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:99px;font-weight:700;}
.toast-hint .body{font-size:15px;line-height:1.6;}
.toast-hint.system{bottom:110px;}
.arena-demo-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center;}
.arena-demo-row .note{font-size:13.5px;color:var(--ink-soft);}
.accordion-toggle{width:100%;text-align:left;border:none;background:transparent;padding:0;font-size:15.5px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:'Noto Sans TC',sans-serif;}
.accordion-body{max-height:0;overflow:hidden;transition:max-height .35s ease;font-size:15px;color:var(--ink-soft);line-height:1.85;}
.accordion-body.open{max-height:400px;margin-top:12px;}
.accordion-body p{margin:0 0 10px;}
.ai-reply-block{background:var(--d4-bg);border-radius:10px;padding:13px 15px;font-size:15px;line-height:1.8;color:var(--ink);margin-top:8px;}
.kmap-live{display:flex;flex-direction:column;gap:9px;margin-top:8px;}
.kmap-live-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink-soft);gap:8px;}
.kmap-live-dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.kdot.sm{width:18px;height:18px;border-radius:5px;font-size:10px;}

/* RESULTS student */
.res-tabs{display:flex;gap:6px;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;width:fit-content;}
.res-tab{border:none;background:transparent;padding:8px 15px;border-radius:7px;font-size:15px;font-weight:500;color:var(--ink-soft);cursor:pointer;}
.res-tab.active{background:var(--ink);color:#fff;}
.res-view{display:none;} .res-view.active{display:block;animation:fadein .3s ease;}
.kmap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media (max-width:880px){.kmap{grid-template-columns:1fr 1fr;}}
.kmap-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;}
.kmap-card .dim{font-size:14.5px;font-weight:700;margin-bottom:8px;}
.kmap-dots{display:flex;gap:6px;flex-wrap:wrap;}
.kdot{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.kmap-legend{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-soft);}
.kmap-legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}
.peer-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
.peer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.peer-top .team{font-weight:700;font-size:16px;}
.peer-solution{font-size:15px;color:var(--ink);line-height:1.85;margin-bottom:12px;white-space:pre-line;background:var(--paper);border-radius:10px;padding:12px 14px;}
.peer-input{display:flex;gap:8px;}
.peer-input input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;}
.peer-comments{margin-top:10px;display:flex;flex-direction:column;gap:7px;}
.peer-comment{font-size:14px;background:var(--paper);padding:8px 11px;border-radius:8px;color:var(--ink-soft);}
.peer-comment b{color:var(--ink);}

/* podium */
.podium-wrap{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:20px 10px 6px;}
.podium-slot{display:flex;flex-direction:column;align-items:center;width:120px;}
.podium-slot .medal{font-size:27px;margin-bottom:6px;}
.podium-slot .pteam{font-size:15px;font-weight:700;margin-bottom:2px;}
.podium-slot .pscore{font-size:13.5px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-bottom:8px;}
.podium-block{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;color:#fff;font-weight:800;font-family:'JetBrains Mono',monospace;font-size:17px;}
.podium-block.gold{height:118px;background:linear-gradient(180deg,#E4C15E,var(--gold));}
.podium-block.silver{height:88px;background:linear-gradient(180deg,#C7CBDA,var(--silver));}
.podium-block.bronze{height:66px;background:linear-gradient(180deg,#D08E5E,var(--bronze));}

.score-summary{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;}
@media (max-width:880px){.score-summary{grid-template-columns:1fr;}}
.score-line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;}
.score-line:last-child{border-bottom:none;}
.score-line .n{color:var(--ink-soft);} .score-line .v{font-family:'JetBrains Mono',monospace;font-weight:700;}
.total-card{background:var(--ink);color:#fff;border-radius:14px;padding:20px 22px;text-align:center;}
.total-card .num{font-size:45px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.total-card .rank{font-size:14.5px;color:#C6C9E2;margin-top:4px;}
.privacy-note{font-size:13.5px;color:var(--ink-faint);margin-top:10px;line-height:1.6;}

/* history */
.hist-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.hist-head{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;flex-wrap:wrap;gap:8px;}
.hist-head .t{font-size:16px;font-weight:700;}
.hist-head .meta{font-size:13.5px;color:var(--ink-soft);margin-top:3px;}
.hist-rank{font-size:14px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--d3-bg);color:var(--d3);}
.hist-body{max-height:0;overflow:hidden;transition:max-height .4s ease;border-top:1px solid var(--line);}
.hist-body.open{max-height:900px;}
.hist-body-inner{padding:16px 18px;}
.hist-feedback{font-size:14.5px;color:var(--ink-soft);line-height:1.8;background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:6px;}
.hist-feedback b{color:var(--ink);}
.grade-solution-label{font-size:13px;font-weight:700;color:var(--ink-soft);}

/* profile */
.profile-card{display:flex;gap:18px;align-items:center;}
.profile-avatar{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--d2),var(--d1));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24.5px;flex:none;}
.profile-meta{font-size:14.5px;color:var(--ink-soft);line-height:2;}
.profile-meta b{color:var(--ink);font-weight:700;}
.rt table{width:100%;border-collapse:collapse;margin-top:8px;}
.rt th,.rt td{text-align:left;padding:8px 8px;font-size:14px;border-bottom:1px solid var(--line);}
.rt th{color:var(--ink-soft);font-weight:500;font-size:12.5px;}
.rt td.num{font-family:'JetBrains Mono',monospace;}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:16px;}
.set-row:last-child{border-bottom:none;}
.set-row .t{font-size:15px;font-weight:500;}
.set-row .d{font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
.switch{position:relative;width:42px;height:24px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#DEDCD0;border-radius:99px;cursor:pointer;transition:.2s;}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--d3);}
.switch input:checked + .slider::before{transform:translateX(18px);}
.set-input{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;width:220px;}

</style>
</head>

function avatarColorFor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) >>> 0; }
  return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
}

function renderRoster(courseId){
  const grid = document.getElementById('courseRosterGrid');
  grid.innerHTML = '';
  const list = (CLASSMATES[courseId] || []).slice().sort((a,b)=>{
    if(a.isSelf) return -1;
    if(b.isSelf) return 1;
    return surnameStrokeCount(a.name) - surnameStrokeCount(b.name);
  });
  list.forEach(s=>{
    const name = s.isSelf ? MY_NAME : s.name;
    const card = document.createElement('div');
    card.className = 'roster-card';
    card.innerHTML = '<div class="roster-avatar" style="background:'+avatarColorFor(name)+'">'+name.charAt(0)+'</div>'
      +'<div class="roster-name">'+name+(s.isSelf?'（你）':'')+'</div>';
    card.addEventListener('click', ()=> loadStudentDetailAndGoto(s.id, courseId));
    grid.appendChild(card);
  });
}

function loadStudentDetailAndGoto(studentId, courseId){
  const s = (CLASSMATES[courseId] || []).find(x=>x.id===studentId);
  const isSelf = !!(s && s.isSelf);

  document.getElementById('sdAvatar').style.background = avatarColorFor(name);
  document.getElementById('sdName').textContent = name + (isSelf ? '（你）' : '');

    ? {
        studentId: document.getElementById('visStudentId').checked,
        email: document.getElementById('visEmail').checked,
        bio: document.getElementById('visBio').checked,
        d4: document.getElementById('vis4D').checked,
        practice: document.getElementById('visPractice').checked,
        competition: document.getElementById('visCompetition').checked,
      }
    : s.visible;
  const bio = isSelf ? savedMyBio : s.bio;
  const scores = isSelf ? MY_SCORES : s.scores;
  const practiceSummary = isSelf ? MY_PRACTICE_SUMMARY : s.practice;
  const competitionSummary = isSelf ? MY_COMPETITION_SUMMARY : s.competition;

  const bioPanel = document.getElementById('sdBioPanel');
  if(vis.bio && bio){
    bioPanel.style.display = 'block';
    document.getElementById('sdBioText').textContent = bio;
  }else{
    bioPanel.style.display = 'none';
  }

  let infoHtml = '';
  if(vis.studentId){ infoHtml += sdRow('學號', isSelf ? MY_STUDENT_ID : s.studentId); }
  if(vis.email){ infoHtml += sdRow('Email', isSelf ? MY_EMAIL : s.email); }
  document.getElementById('sdInfoList').innerHTML = infoHtml || '<div class="sd-empty">這位同學沒有公開其他基本資料。</div>';

  const statsPanel = document.getElementById('sdStatsPanel');
  if(vis.d4){
    statsPanel.style.display = 'block';
    const dims = [['d1','委託',scores.d1],['d2','描述',scores.d2],['d3','辨識',scores.d3],['d4','審慎',scores.d4]];
    document.getElementById('sdRadar').innerHTML = dims.map(([k,label,val])=>
      '<div class="row"><span class="lbl" style="color:var(--'+k+')">'+label+'</span><div class="track"><div class="fill" style="width:'+val+'%;background:var(--'+k+')"></div></div><span class="pct">'+val+'%</span></div>'
    ).join('');
  }else{
    statsPanel.style.display = 'none';
  }

  let recordsHtml = '';
  if(vis.practice){ recordsHtml += '<div class="panel" style="margin-bottom:16px;"><div class="eyebrow">教學面練習紀錄</div><div class="sd-record-line">'+practiceSummary+'</div></div>'; }

  document.getElementById('sdRecordsList').innerHTML = recordsHtml;

  goto('student-detail');
}

}
function exitArena(){
  // 比賽仍在後台繼續進行（倒數不停），只是先離開畫面，回來時會接續原本進度。
  document.body.classList.remove('in-arena');
  mascotLabel.textContent = '賽場入口';
  goto('home');
}

document.getElementById('mascotBtn').addEventListener('click', ()=>{
  if(document.body.classList.contains('in-arena')){ exitArena(); }
  else{ openCodeModal(); }
});
document.getElementById('ctaMascot').addEventListener('click', ()=> goto('courses'));
document.getElementById('codeCancel').addEventListener('click', ()=> veil.classList.remove('show'));
document.getElementById('codeJoin').addEventListener('click', ()=>{
  const v = document.getElementById('codeInput').value.trim();
  if(v.length>0){ veil.classList.remove('show'); enterArena(); }
});

/* ---------- teacher hint (demo, shown on student side) ---------- */
function showTeacherHint(){
  const t = document.getElementById('studentToast');
  document.getElementById('studentToastBody').textContent = '試試看，如果你是最反對這個方案的供應商窗口，你會怎麼問 AI？';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 4200);
}
document.getElementById('replayHintBtn').addEventListener('click', showTeacherHint);
document.getElementById('caseAccToggle').addEventListener('click', ()=>{
  const body = document.getElementById('caseAccBody');
  body.classList.toggle('open');
  document.getElementById('caseAccArrow').textContent = body.classList.contains('open') ? '▴' : '▾';
});

/* ---------- system toast (time warning / pause / extend) ---------- */
function showSystemToast(text){
  const t = document.getElementById('systemToast');
  document.getElementById('systemToastBody').textContent = text;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 4200);
}

/* ---------- sub-question switcher ---------- */
const SUBQ_TITLES = {1:'釐清利害關係人與問題全貌', 2:'提出應對方案與替代選項', 3:'量化財務／營運影響'};
let currentSubQ = 3;
function renderSubQ(){
  document.getElementById('subqHeading').textContent = '第 '+currentSubQ+' 小題（共 3 題）：'+SUBQ_TITLES[currentSubQ];
  document.querySelectorAll('.subq-tab').forEach(btn=>{
    btn.classList.toggle('active', Number(btn.dataset.subq)===currentSubQ);
  });
}
document.querySelectorAll('.subq-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{ currentSubQ = Number(btn.dataset.subq); renderSubQ(); });
});

/* ---------- whole-match countdown ---------- */
let hasActiveMatch = false;
let matchSecondsLeft = 22*60+15;
let matchTimerInterval = null;
let isArenaPaused = false;
let warnedFiveMin = false;
function formatTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function renderMatchTimer(){
  document.getElementById('matchTimer').textContent = formatTime(Math.max(matchSecondsLeft,0));
}
function startMatchTimer(){
  stopMatchTimer();
  matchTimerInterval = setInterval(()=>{
    if(isArenaPaused || matchSecondsLeft<=0) return;
    matchSecondsLeft--;
    renderMatchTimer();
    if(matchSecondsLeft===300 && !warnedFiveMin){
      warnedFiveMin = true;
      showSystemToast('時間剩五分鐘，請盡快請 AI 彙整小組解方！');
    }
  }, 1000);
}
function stopMatchTimer(){
  if(matchTimerInterval){ clearInterval(matchTimerInterval); matchTimerInterval = null; }
}
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  isArenaPaused = !isArenaPaused;
  document.getElementById('pauseBanner').classList.toggle('show', isArenaPaused);
  document.getElementById('pauseBtn').textContent = isArenaPaused ? '（Demo）教師恢復競賽' : '（Demo）教師暫停競賽';
  showSystemToast(isArenaPaused ? '競賽已暫停' : '競賽已恢復');
});
document.getElementById('extendBtn').addEventListener('click', ()=>{
  matchSecondsLeft += 120;
  renderMatchTimer();
  showSystemToast('教師已為全班加時');
});

/* ---------- draft -> AI diff card -> shared chat ---------- */
document.getElementById('draftSubmitBtn').addEventListener('click', function(){
  const draftInput = document.getElementById('draftInput');
  if(containsBannedWord(draftInput.value)){ showSystemToast('內容包含不適當字詞，請修改後再送出。'); return; }
  draftInput.readOnly = true;
  this.disabled = true;
  this.textContent = '已送交 AI 整合';
  document.getElementById('afterDraft').classList.add('show');
});
let isRep = true;
function renderChatRole(){
  const tag = document.getElementById('chatRoleTag');
  const inputRow = document.getElementById('chatInputRow');
  const note = document.getElementById('chatReadonlyNote');
  if(isRep){
    tag.textContent = '· 你是本題代表，可以輸入';
    inputRow.style.display = 'flex';
    note.style.display = 'none';
  }else{
    tag.textContent = '· 你目前是唯讀';
    inputRow.style.display = 'none';
    note.style.display = 'block';
  }
}
document.getElementById('chatRoleToggleBtn').addEventListener('click', ()=>{
  isRep = !isRep;
  renderChatRole();
});
document.getElementById('chatSendBtn').addEventListener('click', ()=>{
  const input = document.getElementById('chatInput');
  const val = input.value.trim();
  if(!val || !isRep) return;
  if(containsBannedWord(val)){ showSystemToast('內容包含不適當字詞，請修改後再送出。'); return; }
  const chat = document.getElementById('sharedChat');
  const div = document.createElement('div');
  div.className = 'chat-msg rep';
  div.innerHTML = '<b>你（代表）：</b>'+val;
  chat.appendChild(div);
  input.value = '';
  chat.scrollTop = chat.scrollHeight;
});

/* ---------- task player ---------- */
let currentTaskId = 'complaint';
let attempt = 1;
function loadTaskAndGoto(id){
  currentTaskId = id;
  attempt = 1;
  const t = TASKS[id];
  document.getElementById('taskTag').textContent = t.tag;
  document.getElementById('taskTitle').textContent = t.title;
  document.getElementById('taskBrief').textContent = t.brief;
  document.getElementById('taskTrap').textContent = t.trap;
  document.getElementById('promptInput').value = t.prefill;
  document.getElementById('dojoPreviewBanner').style.display = t.preview ? 'block' : 'none';
  document.getElementById('attemptNo').textContent = 1;
  document.getElementById('scoreEmpty').style.display='block';
  document.getElementById('scoreBody').style.display='none';
  document.getElementById('rewriteBox').classList.remove('show');
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled=false; submitBtn.textContent='送出提示';
  goto('dojo');
}
document.getElementById('submitBtn').addEventListener('click', function(){
  if(attempt>3) return;
  if(containsBannedWord(document.getElementById('promptInput').value)){ showSystemToast('內容包含不適當字詞，請修改後再送出。'); return; }
  const t = TASKS[currentTaskId];
  document.getElementById('attemptNo').textContent = attempt;
  document.getElementById('scoreEmpty').style.display='none';
  document.getElementById('scoreBody').style.display='block';
  ['d1','d2','d3','d4'].forEach(k=>{ document.getElementById('fill-'+k).style.width='0%'; document.getElementById('num-'+k).style.opacity=0; });
  document.getElementById('checklist').innerHTML='';
  document.getElementById('rewriteBox').classList.remove('show');
  document.getElementById('rewriteTxt').innerHTML = t.rewrite;
  setTimeout(()=>{
    ['d1','d2','d3','d4'].forEach((k,i)=>{
      setTimeout(()=>{
        document.getElementById('fill-'+k).style.width = t.scores[k]+'%';
        document.getElementById('num-'+k).textContent = t.scores[k];
        document.getElementById('num-'+k).style.opacity = 1;
      }, i*120);
    });
  },100);
  setTimeout(()=>{
    const cl = document.getElementById('checklist');
    t.checklist.forEach((item,i)=>{
      const div=document.createElement('div');
      div.className='check-item '+(item.ok?'pass':'fail');
      div.innerHTML = '<span class="mark">'+(item.ok?'✓':'✕')+'</span><span>'+item.text+'</span>';
      cl.appendChild(div);
      setTimeout(()=>div.classList.add('show'), i*140);
    });
  },700);
  setTimeout(()=>{ document.getElementById('rewriteBox').classList.add('show'); }, 1500);
  attempt++;
  if(attempt>3){ this.disabled=true; this.textContent='已達重下上限'; }
});

/* ---------- results tabs ---------- */
document.querySelectorAll('.res-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    const group = tab.closest('section');
    group.querySelectorAll('.res-tab').forEach(t=>t.classList.remove('active'));
    group.querySelectorAll('.res-view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    group.querySelector('#res-'+tab.dataset.res).classList.add('active');
  });
});

/* ---------- peer comment demo ---------- */
function addPeerComment(team){
  const input = document.getElementById('peerInput'+team);
  const val = input.value.trim();
  if(!val) return;
  if(containsBannedWord(val)){ showSystemToast('內容包含不適當字詞，請修改後再送出。'); return; }
  const list = document.getElementById('peerList'+team);
  const div = document.createElement('div');
  div.className='peer-comment';
  div.innerHTML = '<b>C 隊（你）：</b>'+val;
  list.appendChild(div);
  input.value='';
}

/* ---------- history expand ---------- */
document.querySelectorAll('.hist-head').forEach(h=>{
  h.addEventListener('click', ()=>{
    document.getElementById('hist-'+h.dataset.hist).classList.toggle('open');
  });
});

/* ---------- personal bio (個人簡介) ---------- */
const bioInput = document.getElementById('bioInput');
const bioCount = document.getElementById('bioCount');
bioInput.addEventListener('input', ()=>{
  bioCount.textContent = bioInput.value.length+' / 200';
});
document.getElementById('bioSaveBtn').addEventListener('click', ()=>{
  const val = bioInput.value.trim();
  const note = document.getElementById('bioModerationNote');
  if(containsBannedWord(val)){
    note.classList.add('show');
    return;
  }
  note.classList.remove('show');
  savedMyBio = val;
  showSystemToast('已儲存個人簡介');
});

<\/script>
</body>
</html>
</script>
<script type="text/plain" id="src-teacher"><!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt 教學遊戲 — 教師端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2033; --ink-soft:#5B6080; --ink-faint:#9498B3;
  --paper:#F6F5F1; --card:#FFFFFF; --line:#E4E2D8;
  --d1:#C1495B; --d1-bg:#FBEAEC;
  --d2:#C98A2E; --d2-bg:#FBF1E1;
  --d3:#2F8F6C; --d3-bg:#E7F4EE;
  --d4:#3B6EA5; --d4-bg:#E9F1FA;
  --team-e:#8B5FBF;
  --sidebar-w:230px;
  --accent:#3F97E0; --accent-dark:#2A6FAE; --accent-bg:#E8F3FD;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','Noto Sans',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Noto Serif TC','Noto Serif',serif;margin:0;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D8D6C9;border-radius:99px;}

.app{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--ink);color:#EDEDF3;padding:20px 16px;display:flex;flex-direction:column;gap:4px;overflow:hidden;white-space:nowrap;transition:width .25s ease,padding .25s ease,opacity .18s ease;}
.sidebar.collapsed{width:0;padding:20px 0;opacity:0;pointer-events:none;}
.sidebar-toggle{border:2px solid var(--line);background:#fff;color:var(--ink);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:border-color .15s ease,transform .12s ease;}
.sidebar-toggle:hover{border-color:var(--accent);}
.sidebar-toggle:active{transform:scale(.92);}
.sb-top{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.sb-avatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--d4),#2E3552);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
.sb-who .name{font-size:14.5px;font-weight:700;}
.sb-who .role{font-size:11.5px;color:#A9ADCB;}
.sb-link{display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:10px;color:#C6C9E2;font-size:13.5px;cursor:pointer;transition:background .15s ease,color .15s ease,transform .12s ease;}
.sb-link .ic{width:18px;text-align:center;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.icon-svg{flex:none;vertical-align:-3px;}
.btn-ic{display:inline-flex;align-items:center;justify-content:center;margin-right:1px;}
.medal{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;font-size:10.5px;font-weight:800;color:#fff;margin-right:3px;vertical-align:-4px;flex:none;}
.medal.gold{background:#C99A2E;}
.medal.silver{background:#9298AE;}
.medal.bronze{background:#B0703C;}
.sb-link:hover{background:#2A2F49;color:#fff;transform:translateX(2px);}
.sb-link.active{background:var(--accent);color:#fff;font-weight:700;}
.sb-spacer{flex:1;}

.main-col{flex:1;min-width:0;}
.topbar-app{display:flex;align-items:center;justify-content:flex-start;gap:16px;padding:16px 28px;border-bottom:2px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20;flex-wrap:wrap;}
.crumb{font-size:18px;font-weight:700;font-family:'Noto Serif TC',serif;}
.crumb .sub{display:block;font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:400;color:var(--ink-soft);margin-top:2px;}
main{padding:28px;}
.screen{display:none;} .screen.active{display:block;animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;}
.hint-btn{border:none;background:var(--accent);color:#fff;padding:11px 19px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--accent-dark);transition:transform .1s ease,box-shadow .1s ease;}
.hint-btn:hover{filter:brightness(1.06);}
.hint-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark);}
.hint-btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);}
.hint-btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.hint-btn.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.hint-btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px;}
.eyebrow{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}

/* teacher home: course list */
.home-hero{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;background:linear-gradient(135deg,var(--ink),#2E3552);color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:20px;}
.home-greet-title{font-size:19px;font-weight:700;font-family:'Noto Serif TC',serif;}
.home-greet-sub{font-size:13px;color:#C6C9E2;margin-top:5px;}
.home-stats{display:flex;gap:24px;flex-wrap:wrap;}
.home-stat{text-align:center;}
.home-stat-v{font-size:24px;font-weight:800;font-family:'JetBrains Mono',monospace;color:#fff;line-height:1;}
.home-stat-k{font-size:11.5px;color:#B6B4E0;margin-top:5px;}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:980px){.course-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:680px){.course-grid{grid-template-columns:1fr;}}
.course-card{position:relative;overflow:hidden;background:#fff;border:2px solid var(--line);border-radius:16px;padding:21px 19px 18px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;}
.course-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--accent);}
.course-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 6px 0 var(--accent-bg);}
.course-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.course-card .term{font-size:11px;color:var(--accent);font-weight:700;background:var(--accent-bg);display:inline-block;padding:3px 10px;border-radius:99px;}
.course-icon{width:38px;height:38px;border-radius:11px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
.course-card h3{font-size:16px;margin-bottom:8px;line-height:1.4;}
.course-card .meta{font-size:12.5px;color:var(--ink-soft);line-height:1.9;}

/* course detail */
.course-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.course-head h2{font-size:20px;}
.course-head .meta{font-size:13px;color:var(--ink-soft);margin-top:6px;}
.roster-table{width:100%;border-collapse:collapse;}
.roster-table th,.roster-table td{text-align:left;padding:9px 8px;font-size:13px;border-bottom:1px solid var(--line);}
.roster-table th{color:var(--ink-soft);font-weight:700;font-size:11.5px;}
.roster-table tbody tr{transition:background .12s ease;}
.roster-table tbody tr:hover{background:var(--accent-bg);}
.roster-table td.num{font-family:'JetBrains Mono',monospace;}
.past-comp{border-bottom:1px solid var(--line);padding:11px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;transition:background .12s ease;}
.past-comp:hover{background:var(--paper);}
.past-comp-item:last-child .past-comp{border-bottom:none;}
.past-comp .t{font-size:13.5px;font-weight:700;}
.past-comp .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.pc-detail{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.pc-detail.open{max-height:200px;padding-bottom:10px;}
.pc-rank{font-size:12.5px;color:var(--ink-soft);padding:4px 0 4px 6px;}
.syllabus-block h4{font-size:14px;font-weight:700;color:var(--ink);margin:0 0 8px;}
.syllabus-block h4:not(:first-child){margin-top:20px;}
.syllabus-block p{font-size:13px;color:var(--ink-soft);line-height:1.85;margin:0;}
.syllabus-block ul{margin:0;padding-left:20px;}
.syllabus-block li{font-size:13px;color:var(--ink-soft);line-height:2;}

/* setup panel */
.setup-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.setup-row label{font-size:12.5px;color:var(--ink-soft);width:90px;flex:none;}
.setup-row select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;flex:1;min-width:180px;transition:border-color .15s ease;}
.setup-row select:focus{border-color:var(--accent);outline:none;}
.setup-row select.inline{flex:none;min-width:170px;}
.fixed-value-display{font-family:'JetBrains Mono',monospace;font-size:14px;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 16px;display:inline-block;flex:none;}
.setup-hint{font-size:12px;color:var(--ink-soft);}
.code-display{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.2em;background:#fff;border:1.5px dashed var(--accent);color:var(--accent-dark);font-weight:700;border-radius:9px;padding:8px 16px;display:inline-block;}
.code-col{display:flex;flex-direction:column;gap:10px;flex:1;min-width:220px;}
.code-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.code-actions .hint-btn{display:inline-flex;align-items:center;gap:6px;}
.qr-panel{display:none;margin-top:2px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;gap:16px;align-items:center;}
.qr-panel.show{display:flex;}
.qr-panel img{border-radius:9px;border:1.5px solid var(--line);flex:none;background:#fff;width:120px;height:120px;}
.qr-panel-info{flex:1;min-width:0;}
.qr-link-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;}
.qr-link{font-size:12.5px;background:var(--paper);border-radius:8px;padding:8px 10px;margin-bottom:9px;word-break:break-all;}
.copy-toast{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--d3);font-weight:700;opacity:0;transition:opacity .25s ease;}
.copy-toast.show{opacity:1;}
.case-form{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;align-items:start;}
.case-form label{font-size:12.5px;color:var(--ink-soft);padding-top:8px;}
.required-mark{color:var(--d1);margin-left:2px;}
.case-form input[type=text],.case-form input[type=number],.case-form select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;transition:border-color .15s ease;}
.case-form input:focus,.case-form select:focus,.case-form textarea:focus{border-color:var(--accent);outline:none;}
.case-form textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;min-height:64px;resize:vertical;}
.publish-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.radio-line{display:block;font-size:13px;color:var(--ink);padding:6px 0;cursor:pointer;}
.radio-line input{margin-right:8px;}
.bank-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:880px){.bank-list{grid-template-columns:1fr;}}
.bank-item-card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;}
.bank-card-toggle{width:100%;text-align:left;border:none;background:transparent;padding:16px 17px;cursor:pointer;font-family:inherit;}
.bank-item-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 0 var(--accent-bg);}
.bank-item-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.bank-item-card .name{font-size:14.5px;font-weight:700;color:var(--ink);}
.bank-item-card .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
.bic-badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:99px;}
.bic-badge.diff{background:var(--paper);color:var(--ink-soft);}
.bic-badge.pub{background:#E7F4EE;color:var(--d3);}
.bic-badge.priv{background:#F1EADD;color:#8A6A2E;}
.bic-badge.sys{background:#E9F1FA;color:var(--d4);}
.bank-item-card .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.7;}
.bank-item-card .meta2{font-size:11.5px;color:var(--ink-faint);margin-top:8px;}
.expand-arrow{color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:4px;}
.bdl{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.bdv{font-size:13px;color:var(--ink);line-height:1.75;}
.bank-detail-chips{display:flex;gap:6px;flex-wrap:wrap;}
.bank-detail-chip{font-size:11.5px;background:var(--d3-bg);color:var(--d3);padding:3px 10px;border-radius:99px;font-weight:700;}
.bank-detail-row{padding:12px 0;border-bottom:1px solid var(--line);}
.bank-detail-row:last-child{border-bottom:none;}

/* bank detail modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,22,36,.52);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;opacity:0;pointer-events:none;transition:opacity .22s ease;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{background:#fff;border-radius:18px;border:2px solid var(--ink);max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:26px 28px 22px;position:relative;transform:translateY(14px) scale(.98);transition:transform .22s ease;box-shadow:0 10px 0 rgba(28,32,51,.12);}
.modal-overlay.show .modal-box{transform:translateY(0) scale(1);}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex:none;transition:border-color .15s ease,color .15s ease,transform .12s ease;}
.modal-close:hover{border-color:var(--d1);color:var(--d1);}
.modal-close:active{transform:scale(.9);}
.modal-head{margin-bottom:4px;padding-right:36px;}
.modal-head .name{font-size:17px;font-weight:700;font-family:'Noto Serif TC',serif;}
.modal-head .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.modal-danger-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.danger-btn{border:2px solid var(--d1);color:var(--d1);background:#fff;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--d1-bg);}
.danger-btn:hover{background:var(--d1);color:#fff;}
.danger-btn:active{transform:translateY(3px);box-shadow:none;}
.locked-note{font-size:12px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;}

/* console */
.console{
  background-color:var(--ink);
  background-image:
    repeating-linear-gradient(0deg, rgba(127,211,174,.05) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(90deg, rgba(127,211,174,.05) 0 1px, transparent 1px 32px),
    radial-gradient(circle, rgba(127,211,174,.16) 1px, transparent 1.4px);
  background-size:32px 32px,32px 32px,32px 32px;
  animation:circuitDrift 50s linear infinite;
  color:#F1F1EC;border-radius:16px;padding:22px 22px 26px;
}
@keyframes circuitDrift{from{background-position:0 0,0 0,0 0;}to{background-position:128px 0,0 128px,128px 128px;}}
.console-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.console-head h2{color:#fff;font-size:19px;}
.console-sub{color:#A8ACC4;font-size:12.5px;margin-top:3px;}
#pauseBtn{background:linear-gradient(180deg,#F5C57E,#E7A857 55%,#D89A3E);border-color:#E7A857;box-shadow:0 4px 0 #B9812E,inset 0 1px 0 rgba(255,255,255,.4);}
#pauseBtn:active{box-shadow:0 1px 0 #B9812E,inset 0 1px 0 rgba(255,255,255,.25);}
#pauseBtn.resumed{background:linear-gradient(180deg,#8FE0BE,#5FB894 55%,#3E7A5E);border-color:#5FB894;box-shadow:0 4px 0 #3E7A5E,inset 0 1px 0 rgba(255,255,255,.4);}
#pauseBtn.resumed:active{box-shadow:0 1px 0 #3E7A5E,inset 0 1px 0 rgba(255,255,255,.25);}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media (max-width:880px){.stat-row{grid-template-columns:1fr 1fr;}}
.stat-card{background:#262B45;border-radius:12px;padding:14px 16px;border:1.5px solid transparent;transition:border-color .2s ease;}
.stat-card .k{font-size:11.5px;color:#9AA0C0;margin-bottom:6px;}
.stat-card .v{font-size:21px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.stat-card .v.warn{color:#E7A857;}
.stat-card.time-card{display:flex;flex-direction:column;}
.stat-card.time-card.low-time{border-color:rgba(232,106,106,.6);}
.stat-card.time-card.low-time .v{color:#F07575;animation:timePulse 1s ease-in-out infinite;}
@keyframes timePulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.submit-dots{display:flex;gap:5px;margin-top:10px;}
.submit-dots .dot{width:9px;height:9px;border-radius:50%;background:#3A3F63;flex:none;}
.submit-dots .dot.filled{background:#5FB894;box-shadow:0 0 6px rgba(95,184,148,.55);}
.time-add-row{display:flex;gap:6px;margin-top:9px;}
.time-add-btn{border:1px solid #454C78;background:linear-gradient(180deg,#454C78,#333A5C 60%,#282D48);color:#C9CCE4;font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;box-shadow:0 3px 0 #22263F,inset 0 1px 0 rgba(255,255,255,.15);transition:transform .1s ease,box-shadow .1s ease,border-color .15s ease,color .15s ease;}
.time-add-btn:hover{border-color:#7FD3AE;color:#fff;}
.time-add-btn:active{transform:translateY(3px);box-shadow:0 0 0 transparent,inset 0 1px 0 rgba(255,255,255,.1);}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
@media (max-width:880px){.team-grid{grid-template-columns:1fr 1fr;}}
.team-card{
  position:relative;overflow:hidden;border-radius:12px;padding:14px 15px;
  border:1.5px solid transparent;
  background:
    linear-gradient(165deg,#2A2F4C,#262B45 40%) padding-box,
    linear-gradient(135deg,#9AA3C4,#3A3F63 45%,#6169A0 55%,#3A3F63) border-box;
  transition:transform .15s ease,box-shadow .15s ease;cursor:pointer;
}
.team-card::before{content:'';position:absolute;top:-60%;left:-70%;width:45%;height:220%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.09) 48%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.09) 52%,transparent 58%);transform:rotate(6deg);pointer-events:none;}
.team-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.25);}
.team-card.stalled{
  background:
    linear-gradient(165deg,#2A2F4C,#262B45 40%) padding-box,
    linear-gradient(135deg,#F0C374,#C98A2E 45%,#F5D89A 55%,#C98A2E) border-box;
  animation:pulseAmber 1.6s ease-in-out infinite;
}
.team-card.flagged{
  background:
    linear-gradient(165deg,#2A2F4C,#262B45 40%) padding-box,
    linear-gradient(135deg,#E48A96,#C1495B 45%,#F0AEB6 55%,#C1495B) border-box;
}
.team-card.leading{
  background:
    linear-gradient(165deg,#2A2F4C,#262B45 40%) padding-box,
    linear-gradient(135deg,#FFEDBB,#F2C94C 45%,#FFF6DE 55%,#F2C94C) border-box;
  box-shadow:0 6px 16px rgba(242,201,76,.25);
}
@keyframes pulseAmber{0%,100%{box-shadow:0 0 0 0 rgba(201,138,46,.35);}50%{box-shadow:0 0 0 6px rgba(201,138,46,0);}}
.team-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.team-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:5px;}
.status-dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:6px;box-shadow:0 0 5px rgba(255,255,255,.6);}
.status-pill{font-size:11px;padding:3px 8px;border-radius:99px;background:#333A5C;color:#C9CCE4;display:flex;align-items:center;}
.cov-label{font-size:11.5px;color:#9AA0C0;margin-bottom:5px;}
.cov-track{height:8px;border-radius:99px;background:#333A5C;overflow:hidden;margin-bottom:10px;position:relative;}
.cov-track::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 1px,transparent 1px 10%);pointer-events:none;}
.cov-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#2F8F6C,#5FB894);transition:width .8s ease;}
.team-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:20px;}
.flag{font-size:10.5px;padding:2px 7px;border-radius:6px;}
.flag.amber{background:rgba(201,138,46,.18);color:#E7A857;}
.flag.red{background:rgba(193,73,91,.18);color:#E48A96;}
.team-card .go{font-size:11px;color:#7FD3AE;margin-top:8px;font-weight:700;}
.controls-row{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap;}
.controls-row .note{font-size:12px;color:#B0B3D0;}
.end-comp-btn{background:linear-gradient(180deg,#E4808D,#C1495B 55%,#A83B4A);border-color:#C1495B;color:#fff;box-shadow:0 4px 0 #8E3542,inset 0 1px 0 rgba(255,255,255,.35);}
.end-comp-btn:active{box-shadow:0 1px 0 #8E3542,inset 0 1px 0 rgba(255,255,255,.2);}
.pause-banner{display:none;background:rgba(231,168,87,.18);color:#E7A857;border:1px solid #E7A857;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:16px;}
.pause-banner.show{display:block;}
.console-kmap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:880px){.console-kmap-grid{grid-template-columns:1fr 1fr;}}
.console-kmap-card{background:#333A5C;border-radius:10px;padding:10px 12px;border:1.5px solid transparent;position:relative;overflow:hidden;animation:slotPop .35s ease both;}
.console-kmap-grid .console-kmap-card:nth-child(1){animation-delay:.02s;}
.console-kmap-grid .console-kmap-card:nth-child(2){animation-delay:.07s;}
.console-kmap-grid .console-kmap-card:nth-child(3){animation-delay:.12s;}
.console-kmap-grid .console-kmap-card:nth-child(4){animation-delay:.17s;}
.console-kmap-grid .console-kmap-card:nth-child(5){animation-delay:.22s;}
.console-kmap-grid .console-kmap-card:nth-child(6){animation-delay:.27s;}
@keyframes slotPop{from{opacity:0;transform:scale(.85) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
.console-kmap-card.empty{border:1.5px dashed #C1495B;background:rgba(193,73,91,.1);}
.console-kmap-card.empty::after{content:'?';position:absolute;right:8px;top:0;font-size:34px;font-weight:800;color:rgba(232,138,150,.25);font-family:'JetBrains Mono',monospace;line-height:1;}
.console-kmap-card .dim{font-size:11.5px;font-weight:700;color:#fff;margin-bottom:7px;}
.console-kmap-card .chips{display:flex;gap:4px;flex-wrap:wrap;}
.console-kmap-card .empty-note{font-size:10.5px;color:#E48A96;font-weight:700;}

/* team detail */
.td-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.td-head h2{font-size:19px;}
.td-layout{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;margin-bottom:22px;}
@media (max-width:980px){.td-layout{grid-template-columns:1fr;}}
.td-section-label{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:8px;margin-bottom:12px;display:inline-block;}
.td-section-label.teacher-only{background:#EDE7FA;color:#5B3FA8;}
.prompt-log-item{border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;}
.prompt-log-item.rep{border-color:var(--d3);background:var(--d3-bg);}
.prompt-log-item .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
.prompt-log-item .txt{font-size:13px;line-height:1.6;}
.solution-block{background:var(--paper);border-radius:11px;padding:14px 16px;font-size:13.5px;line-height:1.85;white-space:pre-line;margin-top:6px;}
.cov-detail-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.cov-detail-row:last-child{border-bottom:none;}
.cov-detail-row .mk{font-weight:700;flex:none;width:18px;}
.cov-detail-row .mk.ok{color:var(--d3);} .cov-detail-row .mk.no{color:var(--d1);}
.cov-detail-row .note{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.hallu-box{background:#FBEAEC;border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--ink);margin-top:10px;}
.hallu-box b{color:var(--d1);}

.push-panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 17px;}
.push-panel h3{font-size:14.5px;margin-bottom:3px;}
.push-sub{color:var(--ink-soft);font-size:12px;margin-bottom:12px;}
.target-row{display:flex;gap:16px;margin-bottom:12px;font-size:13px;}
.target-row label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.push-suggest{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.push-suggest button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 9px;font-size:11.5px;text-align:left;cursor:pointer;color:var(--ink);transition:border-color .15s ease,transform .12s ease;}
.push-suggest button:hover{border-color:var(--accent);transform:translateY(-1px);}
textarea.pushtext{width:100%;min-height:70px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;resize:vertical;margin-bottom:10px;transition:border-color .15s ease;}
textarea.pushtext:focus{border-color:var(--accent);outline:none;}
.push-log{margin-top:14px;display:flex;flex-direction:column;gap:7px;}
.push-log-item{font-size:12px;background:var(--paper);border-radius:9px;padding:8px 10px;color:var(--ink-soft);}
.push-log-item b{color:var(--ink);}

.toast-hint{position:fixed;right:26px;bottom:26px;width:290px;z-index:70;background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 rgba(28,32,51,.15);padding:14px 15px;transform:translateY(20px) scale(.96);opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.2,.8,.3,1);color:var(--ink);}
.toast-hint.show{transform:translateY(0) scale(1);opacity:1;}
.toast-hint .who{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
.toast-hint .body{font-size:13.5px;line-height:1.6;}

/* results teacher */
.res-tabs{display:flex;gap:6px;margin-bottom:18px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px;width:fit-content;}
.res-tab{border:none;background:transparent;padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:background .15s ease,color .15s ease;}
.res-tab.active{background:var(--accent);color:#fff;}
.res-view{display:none;} .res-view.active{display:block;animation:fadein .3s ease;}

/* mindmap */
.mindmap-wrap{position:relative;width:100%;max-width:700px;height:520px;margin:10px auto;}
.mm-svg{position:absolute;inset:0;width:100%;height:100%;}
.mm-node{position:absolute;transform:translate(-50%,-50%);text-align:center;width:138px;}
.mm-center{width:140px;background:var(--ink);color:#fff;border-radius:14px;padding:14px 12px;font-weight:700;font-size:13.5px;line-height:1.5;box-shadow:0 8px 20px rgba(28,32,51,.2);}
.mm-dim{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;}
.mm-dim.empty{border-style:dashed;border-color:var(--d1);background:#FBEAEC;}
.mm-dim.origin{border-style:dashed;border-color:var(--team-e);background:#F5F0FB;}
.mm-dim .origin-tag{display:inline-block;font-size:9px;font-weight:800;color:var(--team-e);background:#EDE4F7;padding:1.5px 7px;border-radius:99px;margin-bottom:6px;}
.mm-dim .t{font-size:12px;font-weight:700;margin-bottom:6px;}
.mm-dim .chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.mm-chip{width:19px;height:19px;border-radius:5px;font-size:9.5px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;}
.mm-dim .empty-note{font-size:10.5px;color:var(--d1);font-weight:700;}
@media (max-width:680px){
  .mindmap-wrap{height:640px;max-width:420px;}
  .mm-node{width:104px;}
  .mm-center{width:96px;font-size:11px;padding:10px 8px;}
  .mm-dim{padding:6px 6px;}
  .mm-dim .t{font-size:10px;margin-bottom:4px;}
  .mm-dim .origin-tag{font-size:8px;padding:1px 5px;}
  .mm-chip{width:16px;height:16px;font-size:8.5px;}
}
.mm-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:8px;padding-top:16px;border-top:1px solid var(--line);}
.mm-legend-group{display:flex;align-items:center;gap:7px;}
.mm-legend-label{font-size:11.5px;color:var(--ink-soft);}
.mm-legend-key{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:12px;}
.mm-legend-key-item{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-soft);}
.mm-legend-swatch-box{width:16px;height:16px;border-radius:4px;flex:none;}

/* grade cards */
.grade-card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;transition:opacity .3s ease,background .3s ease;}
.grade-card.graded{opacity:.72;background:#FAFAF6;}
.grade-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.grade-top .team{font-weight:700;font-size:14.5px;}
.grade-top .peer-avg{font-size:12px;color:var(--ink-soft);}
.grade-solution-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.ai-eval{background:var(--d4-bg);border-radius:11px;padding:12px 14px;margin:12px 0;font-size:12.5px;color:var(--ink);}
.ai-eval .tag{display:inline-block;background:var(--d4);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;margin-bottom:7px;}
.grade-inputs{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start;}
.grade-inputs input[type=number]{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-family:'JetBrains Mono',monospace;font-size:14px;}
.grade-inputs textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;min-height:56px;resize:vertical;}
.grade-inputs input:disabled,.grade-inputs textarea:disabled{background:#F1F0EA;color:var(--ink-soft);}
.grade-foot{display:flex;justify-content:flex-end;margin-top:12px;}
.lead-table{width:100%;border-collapse:collapse;margin-top:10px;}
.lead-table th,.lead-table td{text-align:left;padding:9px 8px;font-size:13px;border-bottom:1px solid var(--line);}
.lead-table th{color:var(--ink-soft);font-weight:700;font-size:11.5px;}
.lead-table tbody tr{transition:background .12s ease;}
.lead-table tbody tr:hover{background:var(--accent-bg);}
.lead-table td.rk{font-family:'JetBrains Mono',monospace;font-weight:700;}

/* profile / settings (teacher) */
.profile-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.profile-avatar{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--d4),#2E3552);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;flex:none;}
.profile-meta{font-size:13px;color:var(--ink-soft);flex:1;min-width:200px;}
.profile-meta b{color:var(--ink);font-weight:700;}
.profile-name{font-size:16px;font-weight:700;color:var(--ink);font-family:'Noto Serif TC',serif;margin-bottom:5px;}
.profile-role{font-size:12.5px;color:var(--ink-soft);font-weight:400;margin-left:2px;}
.profile-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;}
.profile-stat{font-size:12.5px;color:var(--ink-soft);}
.profile-stat b{color:var(--ink);font-weight:700;font-family:'JetBrains Mono',monospace;}
.eyebrow.with-icon{display:flex;align-items:center;gap:7px;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--ink);}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:13px 10px;margin:0 -10px;border-bottom:1px solid var(--line);gap:16px;border-radius:9px;transition:background .15s ease;}
.set-row:hover{background:var(--paper);}
.set-row:last-child{border-bottom:none;}
.set-row .t{font-size:13.5px;font-weight:500;}
.set-row .d{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.switch{position:relative;width:42px;height:24px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#DEDCD0;border-radius:99px;cursor:pointer;transition:.2s;}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch input:checked + .slider{background:var(--d3);}
.switch input:checked + .slider::before{transform:translateX(18px);}
.set-input{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;width:220px;transition:border-color .15s ease;}
.set-input:focus{border-color:var(--accent);outline:none;}
</style>

function generateArenaCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code='';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('genCode').textContent = code;
  document.getElementById('consoleCode').textContent = code;
  const link = 'https://promptarena.app/join/'+code;
  document.getElementById('joinLink').textContent = link;
  document.getElementById('qrImage').src = 'https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=8&data='+encodeURIComponent(link);
  return code;
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
function flashCopyToast(msg){
  const toast = document.getElementById('copyToast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toast.classList.remove('show'), 1800);
}
document.getElementById('openSetupBtn').addEventListener('click', ()=>{
  openModal('setupModalOverlay');
  if(document.getElementById('genCode').textContent.trim()==='— — — — — —'){
    generateArenaCode();
  }
});

});

function openTeamDetail(name){
  const d = TEAM_DETAIL[name];
  document.getElementById('tdTeamName').textContent = name;
  document.getElementById('tdStatus').textContent = d.status;
  const log = document.getElementById('tdPromptLog');
  log.innerHTML = '';
  const topPrompt = d.prompts.find(p=>p.rep) || d.prompts.slice().sort((a,b)=>b.votes-a.votes)[0];
  if(topPrompt){
    const div = document.createElement('div');
    div.className = 'prompt-log-item rep';
    div.innerHTML = '<div class="top"><span>'+ICON.user+' '+topPrompt.who+' · '+ICON.check+' 本輪代表提示</span><span>4D '+topPrompt.score+' · 得票 '+topPrompt.votes+'</span></div><div class="txt">'+topPrompt.txt+'</div>';
    log.appendChild(div);
  }
  document.getElementById('tdSolution').textContent = d.solution;
  const cov = document.getElementById('tdCoverage');
  cov.innerHTML = '';
  d.coverage.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'cov-detail-row';
    row.innerHTML = '<span class="mk '+(c.ok?'ok':'no')+'">'+(c.ok?'✓':'✕')+'</span><div><div>'+c.item+'</div><div class="note">'+c.note+'</div></div>';
    cov.appendChild(row);
  });
  const hb = document.getElementById('tdHallu');
  if(d.hallucination){
    hb.style.display='block';
    hb.innerHTML = '<b>'+ICON.warning+' 幻覺紀錄：</b>「'+d.hallucination.claim+'」<br>'+d.hallucination.note;
  } else { hb.style.display='none'; }
  document.getElementById('pushTextarea').value='';
  document.getElementById('pushLog').innerHTML='';
  goto('team-detail');
}

document.getElementById('sendPushBtn').addEventListener('click', ()=>{
  const txt = document.getElementById('pushTextarea').value.trim();
  if(!txt) return;
  const target = document.querySelector('input[name=pushTarget]:checked').value;
  const targetLabel = target==='all' ? '全部隊伍' : document.getElementById('tdTeamName').textContent;
  const log = document.getElementById('pushLog');
  const item = document.createElement('div');
  item.className = 'push-log-item';
  item.innerHTML = '<b>已送出 → '+targetLabel+'：</b>'+txt;
  log.prepend(item);
  const toast = document.getElementById('studentToast');
  document.getElementById('studentToastBody').textContent = txt;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toast.classList.remove('show'), 4000);
  document.getElementById('pushTextarea').value='';
});

/* ---------- pause toggle ---------- */
let isPaused = false;
document.getElementById('pauseBtn').addEventListener('click', function(){
  isPaused = !isPaused;
  document.getElementById('pauseBanner').classList.toggle('show', isPaused);
  document.getElementById('pauseIcon').innerHTML = isPaused ? ICON.play : ICON.pause;
  document.getElementById('pauseLabel').textContent = isPaused ? '恢復競賽' : '暫停競賽';

});

/* ---------- add time ---------- */
document.querySelectorAll('.time-add-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const mins = parseInt(btn.dataset.min,10);
    const el = document.getElementById('statTime');
    const [mm, ss] = el.textContent.split(':').map(Number);
    const total = mm*60 + ss + mins*60;
    el.textContent = String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
    updateTimeWarning();
    const toast = document.getElementById('studentToast');
    document.getElementById('studentToastBody').textContent = '教師已為全班加時 '+mins+' 分鐘，把握機會補齊還沒探索的面向。';
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toast.classList.remove('show'), 4000);
  });
});

/* ---------- results tabs ---------- */
document.querySelectorAll('.res-tab').forEach(tab=>{

});

<script>
const frame = document.getElementById('frame');
function load(role){
  const raw = document.getElementById('src-' + role).textContent;
  frame.srcdoc = raw.replace(/<\\\/script/g, '<\/script').replace(/<\\!--/g, '<\!--');
  document.body.classList.add('viewing');
  history.replaceState(null, '', '#' + role);
}
function back(){
  frame.removeAttribute('srcdoc'); frame.src = 'about:blank';
  document.body.classList.remove('viewing');
  history.replaceState(null, '', location.pathname);
}
document.querySelectorAll('.role').forEach(b => b.addEventListener('click', () => load(b.dataset.role)));
document.getElementById('switch').addEventListener('click', back);
if (location.hash === '#student' || location.hash === '#teacher') load(location.hash.slice(1));
</script>
